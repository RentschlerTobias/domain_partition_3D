[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexdp"
version = "0.1.0"
description = "Hexahedral block-structure generation and domain partition, with plugins and an MCP server"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Tobias Rentschler", email = "tobias.rentschler@ihs.uni-stuttgart.de" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.12",
    "meshio>=5.3",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gmsh = ["gmsh>=4.12"]
mcp = ["mcp>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
hexdp = "hexdp.cli:main"

# Plugin groups: the built-in plugins; external packages add their own entries to the same groups.
[project.entry-points."hexdp.detectors"]
rotation_axis = "hexdp.detect.rotation:RotationAxisDetector"
sweep = "hexdp.detect.rotation:SweepDetector"

[project.entry-points."hexdp.strategies"]
algohex = "hexdp.strategies.algohex.plugin:AlgoHexStrategy"
sweep = "hexdp.strategies.sweep.plugin:SweepStrategy"
cgrid = "hexdp.strategies.sweep.plugin:CGridStrategy"
composite = "hexdp.strategies.composite.plugin:CompositeStrategy"

[project.entry-points."hexdp.ops"]
block_collapse = "hexdp.ops.plugins:BlockCollapseOp"

[project.entry-points."hexdp.discretisers"]
keep = "hexdp.fill.plugins:KeepDiscretiser"

[project.entry-points."hexdp.fillers"]
tfi = "hexdp.fill.plugins:TfiFiller"
b5 = "hexdp.fill.plugins:B5Filler"

[project.entry-points."hexdp.exporters"]
vtk = "hexdp.export.plugins:VtkExporter"
foam = "hexdp.export.plugins:FoamExporter"
msh = "hexdp.export.plugins:MshExporter"

[project.entry-points."hexdp.blocks"]
dtoo_rotor = "hexdp.blocks.rotor:DtooRotor"
band_layout = "hexdp.blocks.band:BandLayout"
revolve_fill = "hexdp.blocks.revolve:RevolveFill"
section_sweep = "hexdp.blocks.sweep:SectionSweep"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
