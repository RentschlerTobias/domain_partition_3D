# hexdp workflow: solid tistos runner (hub + 4 blades with fillet) for a modal analysis, from the dtOO parameters,
# composed from building blocks.
#   hexdp run runner_tistos.yaml --set sample=tistos_s1_0131 --set r_bore=0.15
#   hexdp batch runner_tistos.yaml --each sample=tistos_s1_0131,tistos_s1_0317 --set r_bore=0
parameters: {sample: tistos_s1_0131, r_bore: "0.0", fillet: "true"}
name: runner_${sample}_b${r_bore}_f${fillet}
geometry: ${HEXDP_DATA}/tistos/${sample}/params.json
strategy:
  - name: composite
    params:
      steps:
        - {id: rotor, use: dtoo_rotor, params: {fillet: "${fillet}"}}
        - {id: hub_surface, use: band_layout, from: [rotor], params: {h: 0.04}}
        - {id: hub, use: revolve_fill, from: [hub_surface], params: {r_bore: "${r_bore}"}}
        - {id: blades, use: section_sweep, from: [hub_surface, rotor], params: {h: 0.04}}
exporters: [vtk, msh]
resources: {cores: 1, timeout_s: 1800}
accept: {valid: true}
